services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_IMAGE_TAG:-v0.9.5}

    container_name: open-webui

    ports:
      - "127.0.0.1:${OPENWEBUI_PORT:-3000}:8080"

    environment:
      OFFLINE_MODE: "true"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}"
      AUDIO_TTS_ENGINE: "${AUDIO_TTS_ENGINE:-openai}"
      AUDIO_TTS_OPENAI_API_BASE_URL: "${AUDIO_TTS_OPENAI_API_BASE_URL:-http://openedai-speech:8000/v1}"
      AUDIO_TTS_OPENAI_API_KEY: "${AUDIO_TTS_OPENAI_API_KEY:-local-tts}"
      AUDIO_TTS_MODEL: "${AUDIO_TTS_MODEL:-tts-1}"
      AUDIO_TTS_VOICE: "${AUDIO_TTS_VOICE:-fr_FR-siwis-medium}"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-}"
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "false"
      WHISPER_MODEL_AUTO_UPDATE: "${WHISPER_MODEL_AUTO_UPDATE:-false}"

    volumes:
      - open-webui:/app/backend/data

    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

    restart: unless-stopped

  openedai-speech:
    image: ghcr.io/matatonic/openedai-speech-min:latest

    container_name: openedai-speech

    ports:
      - "127.0.0.1:${OPENEDAI_SPEECH_PORT:-8000}:8000"

    volumes:
      - ./openedai-speech/voice_to_speaker.yaml:/app/config/voice_to_speaker.yaml:ro
      - openedai-speech-voices:/app/voices

    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

    restart: unless-stopped

volumes:
  open-webui:
  openedai-speech-voices:
