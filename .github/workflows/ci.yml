name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager-ui/package-lock.json

      - name: Install manager UI dependencies
        working-directory: manager-ui
        run: npm ci

      - name: Repo checks (PowerShell parse, config JSON, UI typecheck and tests)
        run: ./scripts/check.ps1

      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          foreach ($result in $results) {
            $level = if ($result.Severity -eq "Error") { "error" } else { "warning" }
            $file = [System.IO.Path]::GetRelativePath($PWD.Path, $result.ScriptPath).Replace('\', '/')
            Write-Output "::${level} file=$file,line=$($result.Line)::$($result.RuleName): $($result.Message)"
          }
          $errors = @($results | Where-Object Severity -eq "Error")
          Write-Output "PSScriptAnalyzer: $($errors.Count) error(s), $(@($results).Count - $errors.Count) warning(s)."
          if ($errors.Count -gt 0) { exit 1 }

      - name: Build manager UI
        working-directory: manager-ui
        run: npm run build
